<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover · ProjectV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/discover.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/discover-dynamic.css') }}">
</head>

<body class="discover-page" data-auth-page="index" hidden>
    <a class="discover-skip-link" href="#discover-content">Skip to discoveries</a>

    <header class="navbar discover-navbar">
        <div class="navbar-inner">
            <div class="navbar-start">
                <a class="brand" href="/dashboard" aria-label="ProjectV dashboard">
                    <span class="brand-mark">V</span>
                    <span class="brand-name">ProjectV</span>
                </a>
            </div>

            <nav class="primary-nav" aria-label="Primary">
                <span class="nav-hover-pill" aria-hidden="true"></span>
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/discover" class="nav-link is-active" aria-current="page">Discover</a>
                <a href="/saved" class="nav-link">Saved</a><a href="/orders" class="nav-link">Orders</a>
            </nav>

            <div class="navbar-actions">
                <a class="cart-nav-btn" href="/cart" aria-label="Cart">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 3h2l3 12h10l3-9H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
                    <span>Cart</span><b class="cart-count-badge" data-cart-count hidden>0</b>
                </a>
                <div class="profile-menu">
                    <button class="avatar-btn" type="button" aria-label="Profile" aria-haspopup="true">
                        <span>H</span>
                    </button>
                    <div class="profile-menu-panel" role="menu">
                        <button class="profile-menu-item" id="sign-out" type="button" role="menuitem">
                            <span>Sign out</span>
                        </button>
                    </div>
                </div>
                <button class="wallet-btn" type="button">
                    <span class="wallet-status-dot" aria-hidden="true"></span>
                    <span>Wallet</span>
                </button>
            </div>
        </div>
    </header>

    <main class="discover-main" id="discover-content">
        <section class="discover-intro" aria-labelledby="discover-hero-title">
            <div><p class="discover-eyebrow">A little more you</p>
                <h1 id="discover-hero-title">Your next good find.</h1>
                <p id="discover-description">Fresh possibilities, shaped by what you like. A little familiar. A little unexpected.</p>
            </div>
            <button class="discover-button" id="discover-refresh" type="button">Refresh discoveries</button>
        </section>
        <nav class="discover-filters" id="discover-filters" aria-label="Filter discoveries" hidden></nav>
        <p id="discover-notice" class="discover-notice" role="status" hidden></p>
        <div id="discover-sections" aria-busy="true"><div class="discover-loading" role="status">Finding products for you…</div></div>
        <noscript><p>Enable JavaScript to see personalized discoveries, or <a href="/dashboard">open the dashboard</a>.</p></noscript>
    </main>

    <aside class="discover-compare-bar" id="discover-compare-bar" aria-label="Selected comparison" hidden>
        <span id="discover-compare-count"></span>
        <button class="discover-button" id="discover-compare-open" type="button">Compare</button>
        <button class="discover-button" id="discover-compare-clear" type="button">Clear</button>
    </aside>
    <dialog class="discover-dialog" id="discover-compare-dialog" aria-labelledby="discover-compare-title">
        <div class="discover-heading-row"><h2 id="discover-compare-title">A closer look</h2><button class="discover-button" id="discover-compare-close" type="button">Close</button></div>
        <div id="discover-compare-products" class="discover-compare-grid"></div>
    </dialog>
    <div class="discover-toast" id="discover-toast" role="status" hidden></div>
    <div class="sr-only" id="live-status" role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='scripts/discover.bundle.js') }}"></script>
    {% include 'auth-config.html' %}
</body>

</html>
